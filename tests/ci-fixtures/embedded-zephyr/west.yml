# This application is the west manifest repository (T2), laid out like zephyrproject-rtos/example-application.
# Importing Zephyr's manifest registers its west commands; the allowlist keeps the modules out (native_sim needs none).
manifest:
  self:
    path: app
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        name-allowlist:
          - cmsis_6
