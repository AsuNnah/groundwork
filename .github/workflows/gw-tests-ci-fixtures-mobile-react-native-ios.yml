# Generated by Groundwork 0.6.1 (`gw ci write`) for target "ios", stack "react-native", from templates/ci/steps/ios-react-native.yml.
# Not yet verified by Groundwork on a real runner: watch the first run.
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run ios S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/mobile-react-native · ios (react-native)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/mobile-react-native/**", ".github/workflows/gw-tests-ci-fixtures-mobile-react-native-ios.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/mobile-react-native/**", ".github/workflows/gw-tests-ci-fixtures-mobile-react-native-ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: "tests/ci-fixtures/mobile-react-native"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        shell: bash
        run: echo "version=$(cat .nvmrc 2>/dev/null || cat .node-version 2>/dev/null || echo 'lts/*')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install dependencies
        shell: bash
        run: |
          log="$RUNNER_TEMP/gw-install.log"
          if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f yarn.lock ]; then npm install -g yarn && yarn install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then npm install -g bun && bun install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f package-lock.json ]; then npm ci 2>&1 | tee "$log"
          else echo "::error::no lockfile: commit package-lock.json (or your package manager's lockfile) so CI installs the versions you tested"; exit 1; fi
          # npm 12+ and pnpm 10+ skip dependencies' install scripts (Electron's binary download, native builds) unless the project approves them
          if grep -qE "install scripts blocked|Ignored build scripts" "$log"; then echo "::warning::dependency install scripts were blocked: approve the ones you need (npm install-scripts approve <pkg>, or pnpm approve-builds) and commit package.json"; fi
      - run: npm test
      - name: Generate the native project (Expo)
        if: hashFiles('tests/ci-fixtures/mobile-react-native/ios/Podfile') == ''
        run: npx expo prebuild --platform ios --no-install
      - run: cd ios && pod install
      - name: Build for the iOS Simulator
        run: |
          cd ios
          W=$(ls -d *.xcworkspace | head -1)
          xcodebuild build -workspace "$W" -scheme "${W%.xcworkspace}" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
