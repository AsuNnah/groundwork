# Generated by Groundwork 0.7.1 (`gw ci write`) for target "macos", stack "compose-multiplatform", from templates/ci/steps/kmp-desktop.yml.
# Verified by Groundwork on real runners: 2026-11-06 ubuntu-latest, windows-latest, macos-latest
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run macos S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/kmp · macos (compose-multiplatform)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/kmp/**", ".github/workflows/gw-tests-ci-fixtures-kmp-macos.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/kmp/**", ".github/workflows/gw-tests-ci-fixtures-kmp-macos.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: "tests/ci-fixtures/kmp"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: List Gradle tasks
        shell: bash
        run: chmod +x gradlew && ./gradlew -q tasks --all > "$RUNNER_TEMP/gw-tasks.txt"
      - name: Desktop tests and package
        shell: bash
        run: |
          has() { grep -qE "^([^ :]+:)*$1( |$)" "$RUNNER_TEMP/gw-tasks.txt"; }
          if has desktopTest; then t=desktopTest; elif has jvmTest; then t=jvmTest; else echo "::error::no desktop target: add jvm() to the kotlin { } block"; exit 1; fi
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a ./gradlew "$t"; else ./gradlew "$t"; fi
          if has packageDistributionForCurrentOS; then ./gradlew packageDistributionForCurrentOS; fi
