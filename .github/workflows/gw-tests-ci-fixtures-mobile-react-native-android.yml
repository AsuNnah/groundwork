# Generated by Groundwork 0.6.1 (`gw ci write`) for target "android", stack "react-native", from templates/ci/steps/android-react-native.yml.
# Verified by Groundwork on real runners: 2026-11-06 ubuntu-latest
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run android S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/mobile-react-native · android (react-native)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/mobile-react-native/**", ".github/workflows/gw-tests-ci-fixtures-mobile-react-native-android.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/mobile-react-native/**", ".github/workflows/gw-tests-ci-fixtures-mobile-react-native-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: "tests/ci-fixtures/mobile-react-native"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        shell: bash
        run: echo "version=$(cat .nvmrc 2>/dev/null || cat .node-version 2>/dev/null || echo 'lts/*')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install dependencies
        shell: bash
        run: |
          log="$RUNNER_TEMP/gw-install.log"
          if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f yarn.lock ]; then npm install -g yarn && yarn install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then npm install -g bun && bun install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f package-lock.json ]; then npm ci 2>&1 | tee "$log"
          else echo "::error::no lockfile: commit package-lock.json (or your package manager's lockfile) so CI installs the versions you tested"; exit 1; fi
          # npm 12+ and pnpm 10+ skip dependencies' install scripts (Electron's binary download, native builds) unless the project approves them
          if grep -qE "install scripts blocked|Ignored build scripts" "$log"; then echo "::warning::dependency install scripts were blocked: approve the ones you need (npm install-scripts approve <pkg>, or pnpm approve-builds) and commit package.json"; fi
      - run: npm test
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Generate the native project (Expo)
        if: hashFiles('tests/ci-fixtures/mobile-react-native/android/gradlew') == ''
        run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Install Maestro
        if: hashFiles('tests/ci-fixtures/mobile-react-native/.maestro/**') != ''
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        if: hashFiles('tests/ci-fixtures/mobile-react-native/.maestro/**') != ''
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'   # Maestro sends usage analytics unless told not to
        with:
          working-directory: "tests/ci-fixtures/mobile-react-native"
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: adb install android/app/build/outputs/apk/release/app-release.apk && maestro test .maestro
