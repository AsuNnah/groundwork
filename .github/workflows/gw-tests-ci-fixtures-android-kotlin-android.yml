    paths: ["tests/ci-fixtures/android-kotlin/**", ".github/workflows/gw-tests-ci-fixtures-android-kotlin-android.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/android-kotlin/**", ".github/workflows/gw-tests-ci-fixtures-android-kotlin-android.yml"]
