    branches: [main]
    paths: ["tests/ci-fixtures/apple-swiftui/**", ".github/workflows/gw-tests-ci-fixtures-apple-swiftui-macos.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/apple-swiftui/**", ".github/workflows/gw-tests-ci-fixtures-apple-swiftui-macos.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "tests/ci-fixtures/apple-swiftui"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test
        shell: bash
        run: |
          set -eo pipefail
          if ls -d *.xcworkspace >/dev/null 2>&1; then C=(-workspace "$(ls -d *.xcworkspace | head -1)"); elif ls -d *.xcodeproj >/dev/null 2>&1; then C=(-project "$(ls -d *.xcodeproj | head -1)"); else C=(); fi
          SCHEME="${SCHEME:-$(xcodebuild "${C[@]}" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project") or d.get("workspace"))["schemes"][0])')}"
