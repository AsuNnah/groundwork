# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run web S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/web-vite-react · web (vite-react)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/web-vite-react/**", ".github/workflows/gw-tests-ci-fixtures-web-vite-react-web.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/web-vite-react/**", ".github/workflows/gw-tests-ci-fixtures-web-vite-react-web.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "tests/ci-fixtures/web-vite-react"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        shell: bash
        run: echo "version=$(cat .nvmrc 2>/dev/null || cat .node-version 2>/dev/null || echo 'lts/*')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install dependencies
        shell: bash
        run: |
          log="$RUNNER_TEMP/gw-install.log"
          if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f yarn.lock ]; then npm install -g yarn && yarn install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then npm install -g bun && bun install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f package-lock.json ]; then npm ci 2>&1 | tee "$log"
          else echo "::error::no lockfile: commit package-lock.json (or your package manager's lockfile) so CI installs the versions you tested"; exit 1; fi
          # npm 12+ and pnpm 10+ skip dependencies' install scripts (Electron's binary download, native builds) unless the project approves them
          if grep -qE "install scripts blocked|Ignored build scripts" "$log"; then echo "::warning::dependency install scripts were blocked: approve the ones you need (npm install-scripts approve <pkg>, or pnpm approve-builds) and commit package.json"; fi
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - name: Test
        shell: bash
        run: if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      - name: End-to-end tests (Playwright)
        if: hashFiles('tests/ci-fixtures/web-vite-react/playwright.config.*') != ''
        shell: bash
        run: |
          npx playwright install --with-deps
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npx playwright test; else npx playwright test; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && hashFiles('tests/ci-fixtures/web-vite-react/playwright-report/**') != ''
        with:
          name: playwright-report-${{ matrix.os }}
          path: tests/ci-fixtures/web-vite-react/playwright-report
          retention-days: 7
