# Generated by Groundwork 0.7.0 (`gw ci write`) for target "android", stack "flutter", from templates/ci/steps/android-flutter.yml.
# Verified by Groundwork on real runners: 2026-11-06 ubuntu-latest
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run android S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/cross-flutter · android (flutter)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/cross-flutter/**", ".github/workflows/gw-tests-ci-fixtures-cross-flutter-android.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/cross-flutter/**", ".github/workflows/gw-tests-ci-fixtures-cross-flutter-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "tests/ci-fixtures/cross-flutter"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        if: hashFiles('tests/ci-fixtures/cross-flutter/integration_test/**') != ''
        with:
          working-directory: "tests/ci-fixtures/cross-flutter"
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: flutter test integration_test
