    paths: ["tests/ci-fixtures/cross-flutter/**", ".github/workflows/gw-tests-ci-fixtures-cross-flutter-macos.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/cross-flutter/**", ".github/workflows/gw-tests-ci-fixtures-cross-flutter-macos.yml"]
