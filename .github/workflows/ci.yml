# Framework CI: selftest plus a real host scan and CLI smoke test on each OS (macOS on a GitHub runner, not a user Mac).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', 'lts/*']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: node groundwork/bin/selftest.js
      - run: node scripts/ci-smoke.js
      - name: Fixture workflows match the CI templates
        if: runner.os == 'Linux'
        run: node scripts/fixture-workflows.js --check
