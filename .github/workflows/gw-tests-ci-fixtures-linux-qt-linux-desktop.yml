name: "tests/ci-fixtures/linux-qt · linux-desktop (qt)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/linux-qt/**", ".github/workflows/gw-tests-ci-fixtures-linux-qt-linux-desktop.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/linux-qt/**", ".github/workflows/gw-tests-ci-fixtures-linux-qt-linux-desktop.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "tests/ci-fixtures/linux-qt"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev libgl1-mesa-dev
      - run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
