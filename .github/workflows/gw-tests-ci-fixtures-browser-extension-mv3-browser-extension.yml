name: "tests/ci-fixtures/browser-extension-mv3 · browser-extension (mv3)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/browser-extension-mv3/**", ".github/workflows/gw-tests-ci-fixtures-browser-extension-mv3-browser-extension.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/browser-extension-mv3/**", ".github/workflows/gw-tests-ci-fixtures-browser-extension-mv3-browser-extension.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "tests/ci-fixtures/browser-extension-mv3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: node
        shell: bash
        run: echo "version=$(cat .nvmrc 2>/dev/null || cat .node-version 2>/dev/null || echo 'lts/*')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then npm install -g yarn && yarn install --frozen-lockfile
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then npm install -g bun && bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else echo "::error::no lockfile: commit package-lock.json (or your package manager's lockfile) so CI installs the versions you tested"; exit 1; fi
      - run: npm run lint --if-present
      - run: npm run build --if-present
      - name: Test
        shell: bash
        run: if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npm test; else npm test; fi
      - name: End-to-end tests (Playwright)
        if: hashFiles('tests/ci-fixtures/browser-extension-mv3/playwright.config.*') != ''
        shell: bash
        run: |
          npx playwright install --with-deps
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a npx playwright test; else npx playwright test; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && hashFiles('tests/ci-fixtures/browser-extension-mv3/playwright-report/**') != ''
        with:
          name: playwright-report-${{ matrix.os }}
          path: tests/ci-fixtures/browser-extension-mv3/playwright-report
          retention-days: 7
