# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run game S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/game-godot · game (godot)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/game-godot/**", ".github/workflows/gw-tests-ci-fixtures-game-godot-game.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/game-godot/**", ".github/workflows/gw-tests-ci-fixtures-game-godot-game.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "tests/ci-fixtures/game-godot"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - run: godot --headless --import
      - name: Test
        shell: bash
        run: |
          if [ -d addons/gut ]; then godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://test -gexit
          elif [ -f tests/run_tests.gd ]; then godot --headless -s res://tests/run_tests.gd
          else echo "::error::no tests: add GUT (addons/gut) or tests/run_tests.gd"; exit 1; fi
