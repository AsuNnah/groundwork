name: "tests/ci-fixtures/cli-rust · cli (rust)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/cli-rust/**", ".github/workflows/gw-tests-ci-fixtures-cli-rust-cli.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/cli-rust/**", ".github/workflows/gw-tests-ci-fixtures-cli-rust-cli.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "tests/ci-fixtures/cli-rust"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        shell: bash
        run: |
          if [ -f rust-toolchain.toml ] || [ -f rust-toolchain ]; then rustup toolchain install; else rustup toolchain install stable --profile minimal && rustup default stable; fi
          rustup component add clippy rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets
