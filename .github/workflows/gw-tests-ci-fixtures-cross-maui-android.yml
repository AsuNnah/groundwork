# Generated by Groundwork 0.6.1 (`gw ci write`) for target "android", stack "dotnet-maui", from templates/ci/steps/dotnet-maui.yml.
# Verified by Groundwork on real runners: 2026-11-06 ubuntu-latest, windows-latest
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run android S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/cross-maui · android (dotnet-maui)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/cross-maui/**", ".github/workflows/gw-tests-ci-fixtures-cross-maui-android.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/cross-maui/**", ".github/workflows/gw-tests-ci-fixtures-cross-maui-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "tests/ci-fixtures/cross-maui"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ hashFiles('tests/ci-fixtures/cross-maui/global.json') != '' && 'tests/ci-fixtures/cross-maui/global.json' || '' }}
          dotnet-version: ${{ hashFiles('tests/ci-fixtures/cross-maui/global.json') == '' && '10.0.x' || '' }}
      - run: dotnet workload install maui-android
      - name: Build the app
        shell: bash
        run: |
          P=$(grep -l '<UseMaui>true</UseMaui>' $(git ls-files '*.csproj') | head -1)
          F=$(grep -oE 'net[0-9.]+-android[0-9.]*' "$P" | head -1)
          if [ "$RUNNER_OS" = macOS ]; then
            # .NET for iOS and Mac Catalyst accepts one Xcode major.minor; runner images keep several side by side
            X=$(dotnet msbuild "$P" -getProperty:RecommendedXcodeVersion -p:TargetFramework="$F" | cut -d. -f1,2)
            A=$(ls -d "/Applications/Xcode_$X.app" /Applications/Xcode_"$X".[0-9]*.app 2>/dev/null | head -1)
            if [ -z "$A" ]; then
              echo "::error::This .NET workload needs Xcode $X, and this runner has $(ls -d /Applications/Xcode_*.app | sed 's#.*/Xcode_##; s#\.app##' | tr '\n' ' '). Pin a workload set for an installed Xcode in global.json (sdk.workloadVersion), or run on a runner image with Xcode $X."
              exit 1
            fi
            sudo xcode-select -s "$A/Contents/Developer"
          fi
          # a MAUI project lists every platform, and restore needs every listed platform's workload (NETSDK1178): the iOS ones
          # can't exist on Linux, so build this runner's platform alone
          dotnet build "$P" -f "$F" -p:TargetFrameworks="$F" -c Debug
      - name: Test projects
        shell: bash
        run: for t in $(git ls-files '*Tests.csproj' '*.Tests.csproj' | sort -u); do dotnet test "$t" || exit 1; done
