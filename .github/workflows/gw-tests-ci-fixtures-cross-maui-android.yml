# Generated by Groundwork 0.6.0 (`gw ci write`) for target "android", stack "dotnet-maui", from templates/ci/steps/dotnet-maui.yml.
# Not yet verified by Groundwork on a real runner: watch the first run.
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run android S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/cross-maui · android (dotnet-maui)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/cross-maui/**", ".github/workflows/gw-tests-ci-fixtures-cross-maui-android.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/cross-maui/**", ".github/workflows/gw-tests-ci-fixtures-cross-maui-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "tests/ci-fixtures/cross-maui"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ hashFiles('tests/ci-fixtures/cross-maui/global.json') != '' && 'tests/ci-fixtures/cross-maui/global.json' || '' }}
          dotnet-version: ${{ hashFiles('tests/ci-fixtures/cross-maui/global.json') == '' && '10.0.x' || '' }}
      - run: dotnet workload install maui-android
      - name: Build the app
        shell: bash
        run: |
          P=$(grep -l '<UseMaui>true</UseMaui>' $(git ls-files '*.csproj') | head -1)
          dotnet build "$P" -f "$(grep -oE 'net[0-9.]+-android[0-9.]*' "$P" | head -1)" -c Debug
      - name: Test projects
        shell: bash
        run: for t in $(git ls-files '*Tests.csproj' '*.Tests.csproj' | sort -u); do dotnet test "$t" || exit 1; done
