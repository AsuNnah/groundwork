# Verified by Groundwork on real runners: 2026-11-06 windows-latest, 2026-11-07 ubuntu-latest
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run backend S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/backend-dotnet · backend (dotnet)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/backend-dotnet/**", ".github/workflows/gw-tests-ci-fixtures-backend-dotnet-backend.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/backend-dotnet/**", ".github/workflows/gw-tests-ci-fixtures-backend-dotnet-backend.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "tests/ci-fixtures/backend-dotnet"
# Service containers for integration tests (Linux runners only). Match the major versions to production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ hashFiles('tests/ci-fixtures/backend-dotnet/global.json') != '' && 'tests/ci-fixtures/backend-dotnet/global.json' || '' }}
          dotnet-version: ${{ hashFiles('tests/ci-fixtures/backend-dotnet/global.json') == '' && '10.0.x' || '' }}
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
