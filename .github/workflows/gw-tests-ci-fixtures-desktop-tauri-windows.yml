# Generated by Groundwork 0.7.0 (`gw ci write`) for target "windows", stack "tauri", from templates/ci/steps/tauri.yml.
# Verified by Groundwork on real runners: 2026-11-06 ubuntu-latest, windows-latest, macos-latest
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run windows S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/desktop-tauri · windows (tauri)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/desktop-tauri/**", ".github/workflows/gw-tests-ci-fixtures-desktop-tauri-windows.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/desktop-tauri/**", ".github/workflows/gw-tests-ci-fixtures-desktop-tauri-windows.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "tests/ci-fixtures/desktop-tauri"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - id: node
        shell: bash
        run: echo "version=$(cat .nvmrc 2>/dev/null || cat .node-version 2>/dev/null || echo 'lts/*')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install dependencies
        shell: bash
        run: |
          log="$RUNNER_TEMP/gw-install.log"
          if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f yarn.lock ]; then npm install -g yarn && yarn install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then npm install -g bun && bun install --frozen-lockfile 2>&1 | tee "$log"
          elif [ -f package-lock.json ]; then npm ci 2>&1 | tee "$log"
          else echo "::error::no lockfile: commit package-lock.json (or your package manager's lockfile) so CI installs the versions you tested"; exit 1; fi
          # npm 12+ and pnpm 10+ skip dependencies' install scripts (Electron's binary download, native builds) unless the project approves them
          if grep -qE "install scripts blocked|Ignored build scripts" "$log"; then echo "::warning::dependency install scripts were blocked: approve the ones you need (npm install-scripts approve <pkg>, or pnpm approve-builds) and commit package.json"; fi
      - run: rustup toolchain install stable --profile minimal && rustup default stable
        shell: bash
      - run: npm run test --if-present
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build -- --debug --no-bundle
