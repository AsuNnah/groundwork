# Generated by Groundwork 0.6.1 (`gw ci write`) for target "ios", stack "compose-multiplatform", from templates/ci/steps/kmp-ios.yml.
# Verified by Groundwork on real runners: 2026-11-06 macos-latest
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run ios S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/kmp · ios (compose-multiplatform)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/kmp/**", ".github/workflows/gw-tests-ci-fixtures-kmp-ios.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/kmp/**", ".github/workflows/gw-tests-ci-fixtures-kmp-ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: "tests/ci-fixtures/kmp"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: List Gradle tasks
        shell: bash
        run: chmod +x gradlew && ./gradlew -q tasks --all > "$RUNNER_TEMP/gw-tasks.txt"
      - name: iOS simulator tests
        shell: bash
        run: |
          has() { grep -qE "^([^ :]+:)*$1( |$)" "$RUNNER_TEMP/gw-tasks.txt"; }
          if has iosSimulatorArm64Test; then ./gradlew iosSimulatorArm64Test; elif has iosX64Test; then ./gradlew iosX64Test; else echo "::error::no iOS simulator target: add iosSimulatorArm64() to the kotlin { } block"; exit 1; fi
      - name: Build the iOS app for the simulator
        if: hashFiles('tests/ci-fixtures/kmp/iosApp/*.xcodeproj/project.pbxproj') != ''
        shell: bash
        run: |
          proj=$(ls -d iosApp/*.xcodeproj | head -1); scheme=$(basename "$proj" .xcodeproj)
          # a named simulator builds only this runner's architecture: the generic destination adds x86_64, which needs an iosX64() target
          sim=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          xcodebuild -project "$proj" -scheme "$scheme" -destination "platform=iOS Simulator,name=$sim" -configuration Debug CODE_SIGNING_ALLOWED=NO build
