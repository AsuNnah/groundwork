# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run backend S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/backend-java · backend (java-spring)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/backend-java/**", ".github/workflows/gw-tests-ci-fixtures-backend-java-backend.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/backend-java/**", ".github/workflows/gw-tests-ci-fixtures-backend-java-backend.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: "tests/ci-fixtures/backend-java"
# Service containers for integration tests (Linux runners only). Match the major versions to production.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ hashFiles('tests/ci-fixtures/backend-java/.java-version') == '' && '21' || '' }}
          java-version-file: ${{ hashFiles('tests/ci-fixtures/backend-java/.java-version') != '' && 'tests/ci-fixtures/backend-java/.java-version' || '' }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: hashFiles('tests/ci-fixtures/backend-java/gradlew') != ''
      - name: Build and test
        shell: bash
        run: |
          if [ -f gradlew ]; then chmod +x gradlew && ./gradlew build
          elif [ -f mvnw ]; then chmod +x mvnw && ./mvnw -B verify
          elif [ -f pom.xml ]; then mvn -B verify
          else echo "::error::no gradlew, mvnw or pom.xml"; exit 1; fi
