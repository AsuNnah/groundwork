# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run cli S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/cli-python · cli (python)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/cli-python/**", ".github/workflows/gw-tests-ci-fixtures-cli-python-cli.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/cli-python/**", ".github/workflows/gw-tests-ci-fixtures-cli-python-cli.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "tests/ci-fixtures/cli-python"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: py
        shell: bash
        run: echo "version=$(cat .python-version 2>/dev/null || echo 3.13)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ steps.py.outputs.version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: hashFiles('tests/ci-fixtures/cli-python/uv.lock') != ''
      - name: Install and test
        shell: bash
        run: |
          if [ -f uv.lock ]; then uv sync --locked --all-extras && uv run pytest; exit; fi
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev,test]" || echo "::warning::not installable as a package; testing from the source tree"; fi
          pip install pytest
          python -m pytest
