name: "tests/ci-fixtures/game-unity · game (unity)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/game-unity/**", ".github/workflows/gw-tests-ci-fixtures-game-unity-game.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/game-unity/**", ".github/workflows/gw-tests-ci-fixtures-game-unity-game.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: "tests/ci-fixtures/game-unity"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the Unity licence secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; }; then
            echo "::error::Unity needs a licence on CI. Add repository secrets UNITY_EMAIL, UNITY_PASSWORD and either UNITY_LICENSE (Personal: the contents of Unity_lic.ulf) or UNITY_SERIAL (Pro). See https://game.ci/docs/github/activation"
            exit 1
          fi
      - uses: game-ci/unity-test-runner@fa6ced25861c16ef56187828c43f76d00df43a23 # v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: "tests/ci-fixtures/game-unity"
          testMode: all
