# Generated by Groundwork 0.6.1 (`gw ci write`) for target "ios", stack "flutter", from templates/ci/steps/ios-flutter.yml.
# Not yet verified by Groundwork on a real runner: watch the first run.
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run ios S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/cross-flutter · ios (flutter)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/cross-flutter/**", ".github/workflows/gw-tests-ci-fixtures-cross-flutter-ios.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/cross-flutter/**", ".github/workflows/gw-tests-ci-fixtures-cross-flutter-ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: "tests/ci-fixtures/cross-flutter"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator
      - name: Integration tests on the iOS Simulator
        if: hashFiles('tests/ci-fixtures/cross-flutter/integration_test/**') != ''
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"
