# Generated by Groundwork 0.7.0 (`gw ci write`) for target "ios", stack "flutter", from templates/ci/steps/ios-flutter.yml.
# Verified by Groundwork on real runners: 2026-11-07 macos-latest
# Edit freely: `gw ci write` never overwrites this file without --force. Record a run: gw run ios S3 -- gh run watch <run-id> --exit-status
name: "tests/ci-fixtures/cross-flutter · ios (flutter)"
on:
  push:
    branches: [main]
    paths: ["tests/ci-fixtures/cross-flutter/**", ".github/workflows/gw-tests-ci-fixtures-cross-flutter-ios.yml"]
  pull_request:
    paths: ["tests/ci-fixtures/cross-flutter/**", ".github/workflows/gw-tests-ci-fixtures-cross-flutter-ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: "tests/ci-fixtures/cross-flutter"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ios --simulator
      - name: Integration tests on the iOS Simulator
        if: hashFiles('tests/ci-fixtures/cross-flutter/integration_test/**') != ''
        run: |
          # an iPhone on the newest iOS runtime, booted all the way (bootstatus waits; simctl boot returns early)
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin)["devices"]; v=lambda r: [int(n) for n in re.findall(r"\d+", r)]; print(next(x["udid"] for r in sorted((r for r in d if ".iOS-" in r), key=v, reverse=True) for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl bootstatus "$UDID" -b
          # shortcut: flutter can launch the app before it reads the simulator log, miss the VM Service line and wait
          # forever (flutter/flutter#181771; fixed on master by #193142, not in stable 3.47.9). A try gets 15 minutes
          # (SIGALRM ends it, exit 142) and only a hang runs again, once; a failing test fails at once.
          # Drop the loop once your Flutter has the fix.
          for try in 1 2; do
            status=0; perl -e 'alarm shift; exec @ARGV' 900 flutter test integration_test -d "$UDID" || status=$?
            [ "$status" -eq 142 ] || exit "$status"
            echo "::warning::flutter test hung for 15 minutes (try $try of 2): flutter/flutter#181771"
          done
          exit 1
