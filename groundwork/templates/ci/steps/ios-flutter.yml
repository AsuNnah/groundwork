# Flutter on iOS: analyze, test, simulator build, then integration_test on a booted iPhone simulator when integration_test/ exists
# verified: no
# timeout: 45
__INCLUDE flutter-setup__
      - run: flutter build ios --simulator
      - name: Integration tests on the iOS Simulator
        if: hashFiles('__DIR__integration_test/**') != ''
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in d for x in d[r] if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"
