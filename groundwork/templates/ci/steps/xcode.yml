# Xcode project, workspace or Swift package: build and test the first scheme (or $SCHEME) on __xcode_destination__
# verified: 2026-11-06 macos-latest
# timeout: 45
      - name: Build and test
        shell: bash
        run: |
          set -eo pipefail
          if ls -d *.xcworkspace >/dev/null 2>&1; then C=(-workspace "$(ls -d *.xcworkspace | head -1)"); elif ls -d *.xcodeproj >/dev/null 2>&1; then C=(-project "$(ls -d *.xcodeproj | head -1)"); else C=(); fi
          SCHEME="${SCHEME:-$(xcodebuild "${C[@]}" -list -json | python3 -c 'import json,sys; d=json.load(sys.stdin); print((d.get("project") or d.get("workspace"))["schemes"][0])')}"
          DEST='__xcode_destination__'
          if [ "$DEST" = ios-simulator ]; then DEST="platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')"; fi
          xcodebuild test "${C[@]}" -scheme "$SCHEME" -destination "$DEST" CODE_SIGNING_ALLOWED=NO
