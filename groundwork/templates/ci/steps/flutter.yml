# Flutter desktop or web: analyze, test, then `flutter build __flutter_build__` (the pack sets the platform)
# verified: 2026-11-06 ubuntu-latest, macos-latest, 2026-11-07 windows-latest
# timeout: 30
      - name: Linux desktop build dependencies
        if: runner.os == 'Linux' && '__flutter_build__' == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
__INCLUDE flutter-setup__
      - run: flutter build __flutter_build__
