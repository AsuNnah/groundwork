# GTK with Meson: build, then meson test under Xvfb (GTK 3 and 4 development packages)
# verified: 2026-11-06 ubuntu-latest
# timeout: 30
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build pkg-config libgtk-3-dev libgtk-4-dev xvfb
      - run: meson setup build
      - run: meson compile -C build
      - run: xvfb-run -a meson test -C build --print-errorlogs
        env:
          GSK_RENDERER: cairo
