# Kotlin Multiplatform iOS: the shared tests on the iOS simulator (Kotlin/Native), then the Xcode app built for the simulator when iosApp/ exists
# verified: 2026-11-06 macos-latest
# timeout: 60
__INCLUDE kmp-setup__
      - name: iOS simulator tests
        shell: bash
        run: |
          has() { grep -qE "^([^ :]+:)*$1( |$)" "$RUNNER_TEMP/gw-tasks.txt"; }
          if has iosSimulatorArm64Test; then ./gradlew iosSimulatorArm64Test; elif has iosX64Test; then ./gradlew iosX64Test; else echo "::error::no iOS simulator target: add iosSimulatorArm64() to the kotlin { } block"; exit 1; fi
      - name: Build the iOS app for the simulator
        if: hashFiles('__DIR__iosApp/*.xcodeproj/project.pbxproj') != ''
        shell: bash
        run: |
          proj=$(ls -d iosApp/*.xcodeproj | head -1); scheme=$(basename "$proj" .xcodeproj)
          # a named simulator builds only this runner's architecture: the generic destination adds x86_64, which needs an iosX64() target
          sim=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          xcodebuild -project "$proj" -scheme "$scheme" -destination "platform=iOS Simulator,name=$sim" -configuration Debug CODE_SIGNING_ALLOWED=NO build
