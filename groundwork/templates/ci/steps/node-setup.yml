# Node.js setup, included by other fragments: version from .nvmrc / .node-version (default LTS), install from the lockfile
# verified: no
      - id: node
        shell: bash
        run: echo "version=$(cat .nvmrc 2>/dev/null || cat .node-version 2>/dev/null || echo 'lts/*')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then npm install -g pnpm && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then npm install -g yarn && yarn install --frozen-lockfile
          elif [ -f bun.lock ] || [ -f bun.lockb ]; then npm install -g bun && bun install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          else echo "::error::no lockfile: commit package-lock.json (or your package manager's lockfile) so CI installs the versions you tested"; exit 1; fi
