# .NET: restore, build, test. global.json sets the SDK (default 10.0)
# verified: 2026-11-06 windows-latest, 2026-11-07 ubuntu-latest
# timeout: 30
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: ${{ hashFiles('__DIR__global.json') != '' && '__DIR__global.json' || '' }}
          dotnet-version: ${{ hashFiles('__DIR__global.json') == '' && '10.0.x' || '' }}
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
