# Kotlin Multiplatform setup, included by the KMP fragments: JDK 21, Gradle with caching, and the project's task list (target names differ between templates)
# verified: 2026-11-06 ubuntu-latest, windows-latest, macos-latest
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: List Gradle tasks
        shell: bash
        run: chmod +x gradlew && ./gradlew -q tasks --all > "$RUNNER_TEMP/gw-tasks.txt"
